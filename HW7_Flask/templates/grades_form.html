<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Grades (Form)</title>
</head>
<body>
  <h1>Grades</h1>
  <p>Welcome, {{ teacher }}!</p>
  <p>
    <a href="{{ url_for('grades_form') }}">表單版</a> |
    <a href="{{ url_for('grades_ajax') }}">AJAX版</a> |
    <a href="{{ url_for('logout') }}">Logout</a>
  </p>

  <form action="{{ url_for('grades_add') }}" method="post">
    <p>Name: <input name="student_name" required></p>
    <p>Student ID: <input name="student_id" required></p>
    <p>Score: <input name="score" type="number" step="1" required></p>
    <p><button type="submit">Submit</button></p>
  </form>

  <table border="1" cellpadding="4" cellspacing="0">
    <thead><tr><th>Name</th><th>Student ID</th><th>Score</th></tr></thead>
    <tbody>
      {% for r in rows %}
      <tr>
        <td>{{ r['student_name'] }}</td>
        <td>{{ r['student_id'] }}</td>
        <td>{{ r['score'] }}</td>
      </tr>
      {% else %}
      <tr><td colspan="3">No data</td></tr>
      {% endfor %}
    </tbody>
  </table>

  <form action="{{ url_for('grades_delete') }}" method="post" style="margin-top:10px;">
    Enter Student ID to delete:
    <input name="delete_student_id" required>
    <button type="submit">Delete</button>
  </form>
</body>
</html>
